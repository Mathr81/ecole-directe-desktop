<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Connexion</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../shared/base.css" />
  </head>
  <body>
    <form class="ed-window" id="login-form" novalidate>
      <div>
        <h1 class="ed-title">Connexion à ÉcoleDirecte</h1>
        <p class="ed-subtitle">
          Vos identifiants sont enregistrés chiffrés sur cet appareil. Vous
          n'aurez pas à les ressaisir.
        </p>
      </div>

      <div class="ed-error" id="error" hidden></div>

      <div class="ed-body">
        <div class="ed-field">
          <label class="ed-label" for="username">Identifiant</label>
          <input class="ed-input" type="text" id="username" name="username"
                 autocomplete="username" autofocus required />
        </div>

        <div class="ed-field">
          <label class="ed-label" for="password">Mot de passe</label>
          <div class="ed-input-group">
            <input class="ed-input" type="password" id="password" name="password"
                   autocomplete="current-password" required />
            <button class="ed-btn ed-btn--quiet" type="button" id="toggle-password"
                    aria-label="Afficher le mot de passe">Afficher</button>
          </div>
        </div>
      </div>

      <div class="ed-actions">
        <button class="ed-btn ed-btn--primary" type="submit">Se connecter</button>
      </div>
    </form>

    <script>
      const ipc = window.ed;

      const form = document.getElementById("login-form");
      const username = document.getElementById("username");
      const password = document.getElementById("password");
      const errorBox = document.getElementById("error");
      const toggle = document.getElementById("toggle-password");

      function showError(message) {
        errorBox.textContent = message;
        errorBox.hidden = false;
      }

      function clearError() {
        errorBox.hidden = true;
        username.removeAttribute("aria-invalid");
        password.removeAttribute("aria-invalid");
      }

      // Envoye par le processus principal quand les identifiants enregistres
      // ont ete refuses.
      ipc.on("login-error", (message) => showError(message));

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        clearError();

        const u = username.value.trim();
        const p = password.value;

        if (!u || !p) {
          if (!u) username.setAttribute("aria-invalid", "true");
          if (!p) password.setAttribute("aria-invalid", "true");
          showError("Renseignez votre identifiant et votre mot de passe.");
          (!u ? username : password).focus();
          return;
        }

        ipc.send("submit-credentials", { username: u, password: p });
      });

      [username, password].forEach((field) =>
        field.addEventListener("input", clearError)
      );

      toggle.addEventListener("click", () => {
        const revealed = password.type === "text";
        password.type = revealed ? "password" : "text";
        toggle.textContent = revealed ? "Afficher" : "Masquer";
        toggle.setAttribute(
          "aria-label",
          revealed ? "Afficher le mot de passe" : "Masquer le mot de passe"
        );
        password.focus();
      });
    </script>
  </body>
</html>

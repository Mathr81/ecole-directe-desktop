<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Double authentification</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../shared/base.css" />
    <style>
      /* La question vient de l'API : sa longueur varie, elle doit pouvoir
       * passer à la ligne sans pousser les actions hors de la fenêtre. */
      #question {
        margin: 0 0 var(--ed-gap);
        font-weight: var(--ed-label-weight);
      }
    </style>
  </head>
  <body>
    <div class="ed-window">
      <div>
        <h1 class="ed-title">Double authentification</h1>
        <p class="ed-subtitle">
          ÉcoleDirecte demande une vérification. Votre réponse est mémorisée
          pour les prochaines connexions.
        </p>
      </div>

      <div class="ed-error" id="error" hidden></div>

      <div class="ed-body">
        <p id="question"></p>
        <div id="propositions"></div>
      </div>

      <div class="ed-actions">
        <button class="ed-btn ed-btn--quiet" type="button" id="cancel">Annuler</button>
      </div>
    </div>

    <script>
      const ipc = window.ed;

      const questionEl = document.getElementById("question");
      const container = document.getElementById("propositions");
      const errorBox = document.getElementById("error");

      ipc.on("twofa-question", ({ question, propositions }) => {
        questionEl.textContent = question;
        container.replaceChildren();

        if (!propositions || propositions.length === 0) {
          errorBox.textContent =
            "ÉcoleDirecte n'a proposé aucune réponse. Fermez cette fenêtre et réessayez.";
          errorBox.hidden = false;
          return;
        }

        propositions.forEach((proposition) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "ed-btn ed-btn--choice";
          button.textContent = proposition;
          button.addEventListener("click", () => {
            container
              .querySelectorAll("button")
              .forEach((b) => (b.disabled = true));
            ipc.send("twofa-answer", proposition);
          });
          container.appendChild(button);
        });
      });

      document.getElementById("cancel").addEventListener("click", () => {
        window.close();
      });
    </script>
  </body>
</html>

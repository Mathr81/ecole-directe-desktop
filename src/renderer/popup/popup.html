<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:" />
    <title>Lien externe</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../shared/base.css" />
    <style>
      body {
        overflow: hidden;
        user-select: none;
        display: flex;
        flex-direction: column;
      }

      /* Barre de titre déplaçable. Même filet d'accent que les autres
       * fenêtres, en bordure basse puisqu'elle est en haut. */
      #toolbar {
        display: flex;
        align-items: center;
        gap: var(--ed-gap-sm);
        flex-shrink: 0;
        height: 42px;
        padding: 0 var(--ed-gap);
        background: var(--ed-surface);
        border-bottom: 1px solid var(--ed-border);
        box-shadow: inset 0 3px 0 var(--ed-accent);
        -webkit-app-region: drag;
      }

      #toolbar * {
        -webkit-app-region: no-drag;
      }

      #favicon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        /* Masquee tant qu'aucune icone n'a ete chargee : un src vide ou en
         * echec affiche sinon une vignette d'image cassee. */
        visibility: hidden;
      }

      #url-display {
        flex: 1 1 auto;
        min-width: 0;
        height: var(--ed-field-height);
        display: flex;
        align-items: center;
        padding: 0 var(--ed-control-padding-x);
        background: var(--ed-surface-sunken);
        border: 1px solid var(--ed-border);
        border-radius: var(--ed-radius-field);
        color: var(--ed-text-muted);
        font-size: var(--ed-font-size-sm);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: default;
      }

      #btn-close {
        padding: 0 10px;
        font-size: 16px;
        line-height: 1;
        color: var(--ed-text-muted);
      }

      webview {
        flex: 1 1 auto;
        width: 100%;
        border: none;
        background: var(--ed-surface);
      }

      /* Confirmation de copie. Discrète, sans animation décorative. */
      #toast {
        position: fixed;
        bottom: var(--ed-gap-lg);
        left: 50%;
        transform: translateX(-50%);
        padding: var(--ed-gap-xs) var(--ed-gap);
        background: var(--ed-surface-inverse);
        color: var(--ed-text-on-inverse);
        border-radius: var(--ed-radius-control);
        font-size: var(--ed-font-size-sm);
        pointer-events: none;
        z-index: 999;
      }

      #toast[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <img id="favicon" src="" alt="" />
      <div id="url-display">Chargement…</div>
      <button class="ed-btn ed-btn--quiet" id="btn-copy">Copier</button>
      <button class="ed-btn ed-btn--quiet" id="btn-open">Navigateur</button>
      <button class="ed-btn ed-btn--quiet" id="btn-close" aria-label="Fermer">&times;</button>
    </div>

    <webview id="wv" src="about:blank" allowpopups></webview>

    <div id="toast" hidden>URL copiée</div>

    <script>

      const urlDisplay = document.getElementById("url-display");
      const wv = document.getElementById("wv");
      const favicon = document.getElementById("favicon");
      const toast = document.getElementById("toast");
      const btnCopy = document.getElementById("btn-copy");

      let currentUrl = "";
      let toastTimer = null;
      let copyTimer = null;

      function setUrl(url) {
        currentUrl = url;
        urlDisplay.textContent = url;
        urlDisplay.title = url;
        favicon.style.visibility = "hidden";
        try {
          favicon.onload = () => { favicon.style.visibility = "visible"; };
          favicon.onerror = () => { favicon.style.visibility = "hidden"; };
          favicon.src = new URL(url).origin + "/favicon.ico";
        } catch {
          favicon.style.visibility = "hidden";
        }
      }

      function showToast() {
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.hidden = true; }, 2000);
      }

      function copyUrl() {
        window.popup.copyUrl(currentUrl);
        btnCopy.textContent = "Copié";
        clearTimeout(copyTimer);
        copyTimer = setTimeout(() => { btnCopy.textContent = "Copier"; }, 2000);
        showToast();
      }

      window.popup.onLoadUrl((url) => {
        setUrl(url);
        wv.src = url;
      });

      wv.addEventListener("did-navigate", (e) => setUrl(e.url));
      wv.addEventListener("did-navigate-in-page", (e) => {
        if (e.isMainFrame) setUrl(e.url);
      });
      wv.addEventListener("page-title-updated", (e) => {
        document.title = e.title || "Lien externe";
      });

      btnCopy.addEventListener("click", copyUrl);
      document.getElementById("btn-open").addEventListener("click", () => {
        window.popup.openExternal(currentUrl);
      });
      document.getElementById("btn-close").addEventListener("click", () => {
        window.close();
      });

      // Rechargement, outils et navigation sont geres dans le processus
      // principal (features/shortcuts.js) : ils repondent aussi quand le
      // focus est dans la <webview>, ce qui n'etait pas le cas ici.
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "l") copyUrl();
      });
    </script>
  </body>
</html>

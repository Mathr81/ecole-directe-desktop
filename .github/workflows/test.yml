name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron 44 telecharge son binaire au premier require("electron") :
      # sans cette etape, les fichiers de test, lances en parallele, le
      # telechargent ensemble et se marchent dessus (icudtl.dat: File exists).
      - name: Install Electron binary
        run: pnpm exec install-electron

      - name: Tests
        run: pnpm test
